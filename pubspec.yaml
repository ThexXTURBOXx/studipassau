name: studipassau
description: StudiPassau Reimagined using Flutter
homepage: https://play.google.com/store/apps/details?id=studip_uni_passau.femtopedia.de.unipassaustudip
repository: https://github.com/ThexXTURBOXx/studipassau
issue_tracker: https://github.com/ThexXTURBOXx/studipassau/issues

publish_to: 'none'

version: 2.2.0+220

environment:
  flutter: ^3.50.0
  sdk: ^3.14.0

dependencies:
  black_hole_flutter: ^2.0.0
  cached_network_image: ^4.0.0
  catcher_2: ^3.0.0-alpha.0
  collection: ^1.15.0
  dart_date: ^1.1.0
  easy_search_bar_2: ^2.0.0
  envied: ^1.0.0
  filesize: ^2.0.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  flutter_cache_manager: ^3.1.2
  flutter_colorpicker: ^1.1.0
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.0.0
  flutter_native_splash: ^2.0.1+1
  flutter_secure_storage: ^11.0.0
  flutter_sticky_header: ^0.11.0
  flutter_widget_from_html_core: ^0.17.0
  freezed_annotation: ^3.1.0
  fwfh_url_launcher: ^0.16.0
  http: ^1.0.0
  intl: '>=0.19.0 <1.0.0'
  json_annotation: ^4.12.0
  latlong2: '>=0.9.0 <1.0.0'
  material_ui: ^1.1.1
  oauth2_client: ^5.0.0-alpha.1
  open_file: ^4.0.0
  openmensa: ^3.0.0
  package_info_plus: ^10.0.0
  path_provider: ^2.0.11
  pref: ^3.0.0
  quick_actions: ^1.0.0
  sentry: ^10.0.0
  sentry_flutter: ^10.0.0
  share_plus: ^13.0.0
  shared_preferences: ^2.0.15
  sn_progress_dialog: ^2.0.0
  sprintf: ^7.0.0
  string_similarity: ^2.0.0
  studip: ^3.1.0
  supercharged: ^2.1.1
  timetable: ^1.0.0-alpha.8
  tuple: ^2.0.1
  url_launcher: ^6.0.9

dev_dependencies:
  build_runner: ^2.1.11
  envied_generator: ^1.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  json_serializable: ^6.13.0

dependency_overrides:
  fluttertoast:
    git:
      url: https://github.com/ponnamkarthik/FlutterToast.git
      ref: 04481c8801b9729ca4edd05e044c34a13f772cf1
  pref:
    git:
      url: https://github.com/ThexXTURBOXx/flutter_pref.git
      path: pref
  sn_progress_dialog:
    git:
      url: https://github.com/ThexXTURBOXx/Flutter-Progress-Dialog.git
      ref: master
  timetable:
    git:
      url: https://github.com/ThexXTURBOXx/timetable.git
      ref: material_ui

flutter_launcher_icons:
  adaptive_icon_background: '#2898f1'
  adaptive_icon_foreground: 'assets/icons/studipassau_icon.png'
  adaptive_icon_foreground_inset: 0
  android: true
  image_path: 'assets/icons/studipassau_icon.png'
  ios: true
  min_sdk_android: 24

flutter:
  assets:
    # We also want the icons in some places
    - assets/icons/
  fonts:
    - family: StudiPassauIcons
      fonts:
        - asset: fonts/StudiPassauIcons.ttf
  generate: true
  uses-material-design: true

flutter_native_splash:
  color: '#2898f1'
  image: assets/icons/studipassau_icon.png
  color_dark: '#000000'
  android_min_sdk: 24
  android_12:
    color: '#2898f1'
    image: assets/icons/studipassau_icon.png
    color_dark: '#000000'
